[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "memreplay"
version = "0.2.0"
description = "Glasses video -> layered 4D scene (background splat + dynamic objects + tracks) -> memory.json"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "OpenEXR",
  "opencv-python-headless",
  "pydantic>=2",
  "scipy",
  "trimesh",
]

[project.optional-dependencies]
claude = ["anthropic"]
publish = ["boto3"]
test = ["pytest"]

[project.scripts]
memreplay = "memreplay.cli:main"

[tool.setuptools.packages.find]
include = ["memreplay*"]   # pipeline/ also holds runpod/ (shell scripts), which is not a package
