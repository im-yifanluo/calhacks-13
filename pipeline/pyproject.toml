[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "memreplay"
version = "0.2.0"
description = "Glasses video -> layered 4D scene (background splat + dynamic objects + tracks) -> memory.json"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "OpenEXR>=3.3",
  "opencv-python-headless",
  "pydantic>=2",
  "scipy",
  "trimesh",
]

[project.optional-dependencies]
claude = ["anthropic"]
publish = ["boto3"]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff"]

[project.scripts]
memreplay = "memreplay.cli:main"

[tool.setuptools.packages.find]
include = ["memreplay*"]   # pipeline/ also holds runpod/, tools/ and experiments/, which are not packages

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import memreplay from this checkout even without `pip install -e`, e.g. `pytest pipeline` from the repo root.
pythonpath = ["."]
