<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pipeline status</title>
<style>
  :root { --bg: #0c151e; --panel: #142230; --text: #e6eef5; --muted: #8fa3b5; --accent: #5fe3c0; --warn: #ffb36b; --bad: #ff6b6b; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 28px 0 10px; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
  .muted { color: var(--muted); } .panel { background: var(--panel); border-radius: 10px; padding: 14px 16px; }
  table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #1f3140; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .bar { height: 8px; background: #1f3140; border-radius: 4px; overflow: hidden; min-width: 120px; } .bar i { display: block; height: 100%; background: var(--accent); }
  .ok { color: var(--accent); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  a { color: var(--accent); } .links a { margin-right: 10px; white-space: nowrap; }
  ul.log { list-style: none; padding: 0; margin: 0; } ul.log li { padding: 6px 0; border-bottom: 1px solid #1f3140; } ul.log time { color: var(--muted); margin-right: 10px; font-variant-numeric: tabular-nums; }
  code { background: #1f3140; padding: 1px 5px; border-radius: 4px; }
  @media (max-width: 700px) { td, th { padding: 6px 4px; } .links a { display: block; } }
</style>
</head>
<body>
<h1>Memory Replay · vision pipeline</h1>
<div class="muted" id="updated">loading…</div>

<h2>GPU pod</h2>
<div class="panel" id="pod"></div>

<h2>Scenes</h2>
<div class="panel"><table id="scenes"><thead><tr><th>Clip</th><th>Room splat</th><th>Layers</th><th>Open</th></tr></thead><tbody></tbody></table>
<p class="muted" style="margin:10px 0 0">Open modes: <b>free</b> = inspect anywhere; <b>guided</b> = stay near the recorded path, what the camera never saw fades out. <b>Dynamic</b> = room + people + props on the timeline; <b>static</b> = the room alone.</p></div>

<h2>Progress log</h2>
<div class="panel"><ul class="log" id="log"></ul></div>

<script>
const base = location.origin;
function pct(p) { return `<div class="bar"><i style="width:${Math.round(p * 100)}%"></i></div>`; }
async function refresh() {
  let s;
  try { s = await (await fetch('/memories/status.json?t=' + Date.now())).json(); }
  catch (e) { document.getElementById('updated').textContent = 'No status.json yet (' + e + ')'; return; }
  document.getElementById('updated').textContent = `Updated ${new Date(s.updated).toLocaleTimeString()} · ${s.note ?? ''}`;
  const pod = s.pod ?? {};
  document.getElementById('pod').innerHTML = `
    <div><b>${pod.name ?? '—'}</b> <span class="muted">${pod.gpu ?? ''} · ${pod.state ?? 'unknown'} · ${pod.cost ?? ''}</span></div>
    <div class="muted" style="margin-top:6px">${(pod.lines ?? []).map(l => `<div>${l}</div>`).join('')}</div>`;
  const tb = document.querySelector('#scenes tbody'); tb.innerHTML = '';
  for (const c of s.scenes ?? []) {
    const links = [];
    if (c.dynamic) links.push(`<a href="${base}/?memory=/memories/${c.id}/memory.json&mode=free">dynamic · free</a>`, `<a href="${base}/?memory=/memories/${c.id}/memory.json&mode=guided">dynamic · guided</a>`);
    if (c.static) links.push(`<a href="${base}/?memory=/memories/${c.id}/memory.static.json&mode=free">static · free</a>`, `<a href="${base}/?memory=/memories/${c.id}/memory.static.json&mode=guided">static · guided</a>`);
    if (c.grid) links.push(`<a href="${c.grid}">original vs render</a>`);
    const cls = c.room_state === 'done' ? 'ok' : c.room_state === 'failed' ? 'bad' : 'warn';
    tb.insertAdjacentHTML('beforeend', `<tr><td><b>${c.title ?? c.id}</b><div class="muted">${c.id} · ${c.seconds ? c.seconds + ' s' : ''}</div></td>
      <td><span class="${cls}">${c.room_state ?? '—'}</span> ${c.room_progress != null ? pct(c.room_progress) : ''}<div class="muted">${c.room_note ?? ''}</div></td>
      <td>${c.layers ?? '—'}</td><td class="links">${links.join('') || '<span class="muted">not on this machine yet</span>'}</td></tr>`);
  }
  document.getElementById('log').innerHTML = (s.log ?? []).slice().reverse().map(e => `<li><time>${new Date(e.t).toLocaleTimeString()}</time>${e.msg}</li>`).join('');
}
refresh(); setInterval(refresh, 15000);
</script>
</body>
</html>
